<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redcrdd</title>
<meta name="description" content="Redcrdd - fast AI answers, by text or voice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --text:#f5f5f7; --muted:rgba(245,245,247,.6);
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.14); --accent:#ff3b4e; --accent2:#ff8a5b;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f4f1ee; --text:#14110f; --muted:rgba(20,17,15,.6);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.75);
  --border:rgba(20,17,15,.12); --shadow:0 20px 60px rgba(60,30,20,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; transition:background .4s ease,color .4s ease;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:radial-gradient(circle,var(--accent),transparent 65%);top:-14vmax;left:-10vmax}
.b2{width:40vmax;height:40vmax;background:radial-gradient(circle,var(--accent2),transparent 65%);bottom:-12vmax;right:-8vmax;animation-delay:-6s}
.b3{width:30vmax;height:30vmax;background:radial-gradient(circle,#7a5cff,transparent 65%);top:40%;left:50%;animation-delay:-12s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}

.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--border);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
  border-radius:26px;
}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:34px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.pill-btn,select{
  appearance:none;-webkit-appearance:none;background:var(--glass-strong);color:var(--text);
  border:1px solid var(--border);border-radius:999px;padding:9px 14px;
  font:600 13px Inter,system-ui,sans-serif;cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
select option{color:#111}

.hero{text-align:center;margin:10px 0 26px}
.hero h1{font-size:clamp(34px,8vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hero h1 span{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:12px;font-size:16px}

.search{padding:10px;display:flex;align-items:center;gap:8px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:500 17px Inter,system-ui,sans-serif;padding:12px 10px}
.search input::placeholder{color:var(--muted)}
.circ{
  width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 30px rgba(255,59,78,.35);transition:transform .15s ease,opacity .2s;
}
.circ:active{transform:scale(.92)}
.circ.ghost{background:var(--glass-strong);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.circ.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,78,.6)}70%{box-shadow:0 0 0 16px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}
button:disabled{opacity:.45;cursor:not-allowed}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 0}
.chip{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 14px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.answer{margin-top:22px;padding:22px 22px 18px;display:none}
.answer.show{display:block;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q{font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:600}
.a{font-size:17px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--text) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.error{color:var(--accent)}

.section-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 4px 12px;display:flex;justify-content:space-between;align-items:center}
.hist{padding:6px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:14px;border-radius:18px;cursor:pointer;font:500 15px Inter,system-ui,sans-serif;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--glass-strong)}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(120px);background:var(--glass-strong);border:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 18px;border-radius:999px;font-size:14px;transition:transform .35s ease;z-index:9;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="wrap">
  <header class="glass">
    <div class="brand"><span class="dot"></span>Redcrdd</div>
    <div class="tools">
      <select id="lang" aria-label="Language">
        <option value="en-US">English</option>
        <option value="es-ES">Español</option>
      </select>
      <button class="pill-btn" id="theme" type="button">Light</button>
    </div>
  </header>

  <section class="hero">
    <h1 id="h1">Ask <span>anything.</span></h1>
    <p id="sub">Fast answers, by text or voice.</p>
  </section>

  <form class="glass search" id="form" autocomplete="off">
    <input id="q" type="text" placeholder="Ask Redcrdd..." maxlength="500" enterkeyhint="send">
    <button type="button" class="circ ghost" id="mic" aria-label="Speak">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="circ" id="go" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <div class="chips" id="chips"></div>

  <div class="glass answer" id="answer">
    <div class="q" id="aq"></div>
    <div class="a" id="aa"></div>
    <div class="actions">
      <button class="pill-btn" id="speak" type="button">Listen</button>
      <button class="pill-btn" id="copy" type="button">Copy</button>
    </div>
  </div>

  <div class="section-title"><span id="histTitle">Recent</span><button class="pill-btn" id="clear" type="button" style="padding:6px 12px;font-size:12px">Clear</button></div>
  <div class="glass hist" id="hist"></div>

  <footer>© Redcrdd</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var WORKER = "https://redcrdd-ai.bhimm529.workers.dev/?q=";

  var T = {
    "en-US": {
      h1:'Ask <span>anything.</span>', sub:'Fast answers, by text or voice.',
      ph:'Ask Redcrdd...', listen:'Listen', stop:'Stop', copy:'Copy', copied:'Copied',
      recent:'Recent', clear:'Clear', empty:'Your questions will appear here.',
      thinking:'Thinking...', err:'Something went wrong. Please try again.',
      slow:'Still thinking... the AI can take a moment.', noVoice:'Voice is not supported in this browser.',
      listening:'Listening...', theme:'Light', themeDark:'Dark',
      chips:['Explain quantum computing simply','Write a short poem about the sea','Give me 3 tips to sleep better','What is a good workout for beginners?'],
      nothing:'Please type a question first.'
    },
    "es-ES": {
      h1:'Pregunta <span>lo que quieras.</span>', sub:'Respuestas rápidas, por texto o voz.',
      ph:'Pregunta a Redcrdd...', listen:'Escuchar', stop:'Parar', copy:'Copiar', copied:'Copiado',
      recent:'Recientes', clear:'Borrar', empty:'Tus preguntas aparecerán aquí.',
      thinking:'Pensando...', err:'Algo salió mal. Inténtalo de nuevo.',
      slow:'Sigue pensando... la IA puede tardar un momento.', noVoice:'La voz no es compatible con este navegador.',
      listening:'Escuchando...', theme:'Claro', themeDark:'Oscuro',
      chips:['Explica la computación cuántica de forma sencilla','Escribe un poema corto sobre el mar','Dame 3 consejos para dormir mejor','¿Qué ejercicio es bueno para principiantes?'],
      nothing:'Escribe una pregunta primero.'
    }
  };

  var $ = function(id){ return document.getElementById(id); };
  var lang = localStorage.getItem("rc_lang") || "en-US";
  var theme = localStorage.getItem("rc_theme") || "dark";
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem("rc_hist") || "[]"); } catch(e){ hist = []; }
  var cache = {};
  var busy = false, current = "", recog = null, speaking = false, toastT = null;

  function saveHist(){ try{ localStorage.setItem("rc_hist", JSON.stringify(hist.slice(0,30))); }catch(e){} }

  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function applyTheme(){
    document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
    $("theme").textContent = theme === "light" ? T[lang].themeDark : T[lang].theme;
  }

  function renderChips(){
    var box = $("chips"); box.innerHTML = "";
    T[lang].chips.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c;
      b.onclick = function(){ $("q").value = c; ask(c); };
      box.appendChild(b);
    });
  }

  function renderHist(){
    var box = $("hist"); box.innerHTML = "";
    if(!hist.length){
      var e = document.createElement("div"); e.className = "empty"; e.textContent = T[lang].empty;
      box.appendChild(e); return;
    }
    hist.forEach(function(h){
      var b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.textContent = h.q;
      var s = document.createElement("small"); s.textContent = h.a;
      b.appendChild(s);
      b.onclick = function(){ showAnswer(h.q, h.a, false); };
      box.appendChild(b);
    });
  }

  function applyLang(){
    var s = T[lang];
    $("lang").value = lang;
    document.documentElement.lang = lang.slice(0,2);
    $("h1").innerHTML = s.h1;
    $("sub").textContent = s.sub;
    $("q").placeholder = s.ph;
    $("speak").textContent = speaking ? s.stop : s.listen;
    $("copy").textContent = s.copy;
    $("histTitle").textContent = s.recent;
    $("clear").textContent = s.clear;
    applyTheme();
    renderChips();
    renderHist();
  }

  function showAnswer(q, a, isError){
    var card = $("answer");
    $("aq").textContent = q;
    var aa = $("aa");
    aa.textContent = a;
    aa.className = "a" + (isError ? " error" : "");
    card.classList.remove("show"); void card.offsetWidth; card.classList.add("show");
    current = isError ? "" : a;
  }

  function fetchAnswer(q){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 30000);
    return fetch(WORKER + encodeURIComponent(q), {signal: ctrl.signal})
      .then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
      .then(function(d){
        clearTimeout(timer);
        if(!d || !d.answer) throw new Error("empty");
        return String(d.answer).trim();
      }, function(e){ clearTimeout(timer); throw e; });
  }

  function finish(q, a){
    hist = [{q:q, a:a.slice(0,120)}].concat(hist.filter(function(h){ return h.q !== q; })).slice(0,30);
    saveHist(); renderHist();
    busy = false; $("go").disabled = false;
  }

  function ask(q){
    q = (q || "").trim();
    if(!q){ toast(T[lang].nothing); return; }
    if(busy) return;
    busy = true; $("go").disabled = true;

    var key = lang + "|" + q.toLowerCase();
    if(cache[key]){
      showAnswer(q, cache[key], false);
      finish(q, cache[key]);
      return;
    }

    showAnswer(q, T[lang].thinking, false);
    $("aa").classList.add("shimmer");
    var slowT = setTimeout(function(){ toast(T[lang].slow); }, 8000);

    fetchAnswer(q).then(function(a){
      clearTimeout(slowT);
      $("aa").classList.remove("shimmer");
      cache[key] = a;
      showAnswer(q, a, false);
      finish(q, a);
    }, function(){
      clearTimeout(slowT);
      $("aa").classList.remove("shimmer");
      showAnswer(q, T[lang].err, true);
      busy = false; $("go").disabled = false;
    });
  }

  function speak(text){
    if(!("speechSynthesis" in window)){ toast(T[lang].noVoice); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.onend = function(){ speaking = false; $("speak").textContent = T[lang].listen; };
    speaking = true; $("speak").textContent = T[lang].stop;
    speechSynthesis.speak(u);
  }

  function stopSpeak(){
    if("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; $("speak").textContent = T[lang].listen;
  }

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    ask($("q").value);
  });

  $("lang").addEventListener("change", function(e){
    lang = e.target.value;
    localStorage.setItem("rc_lang", lang);
    if(recog){ try{ recog.stop(); }catch(x){} }
    applyLang();
  });

  $("theme").addEventListener("click", function(){
    theme = theme === "light" ? "dark" : "light";
    localStorage.setItem("rc_theme", theme);
    applyTheme();
  });

  $("speak").addEventListener("click", function(){
    if(speaking){ stopSpeak(); return; }
    if(current) speak(current);
  });

  $("copy").addEventListener("click", function(){
    if(!current) return;
    var done = function(){ toast(T[lang].copied); };
    if(navigator.clipboard) navigator.clipboard.writeText(current).then(done, done);
    else done();
  });

  $("clear").addEventListener("click", function(){
    hist = []; saveHist(); renderHist();
  });

  $("mic").addEventListener("click", function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast(T[lang].noVoice); return; }
    if(recog){
      try{ recog.stop(); }catch(x){}
      recog = null; $("mic").classList.remove("listening");
      return;
    }
    recog = new SR();
    recog.lang = lang;
    recog.interimResults = true;
    recog.continuous = false;
    $("mic").classList.add("listening");
    toast(T[lang].listening);
    recog.onresult = function(ev){
      var text = "";
      for(var i = 0; i < ev.results.length; i++){ text += ev.results[i][0].transcript; }
      $("q").value = text;
      if(ev.results[ev.results.length-1].isFinal){ ask(text); }
    };
    recog.onend = function(){ $("mic").classList.remove("listening"); recog = null; };
    recog.onerror = function(){ $("mic").classList.remove("listening"); recog = null; };
    try{ recog.start(); }catch(e){ recog = null; $("mic").classList.remove("listening"); }
  });

  applyLang();
})();
</script>
</body>
</html>
