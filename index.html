<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redcrdd</title>
<meta name="description" content="Redcrdd - fast AI answers by text or voice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --text:#f5f5f7; --muted:rgba(245,245,247,.62);
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.14); --accent:#ff3b4e; --accent2:#ff8a5b;
  --shadow:0 24px 70px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f4f1ee; --text:#14110f; --muted:rgba(20,17,15,.62);
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.85);
  --border:rgba(20,17,15,.12); --shadow:0 24px 70px rgba(60,30,20,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s ease,color .5s ease;
}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Liquid background canvas */
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;filter:blur(38px) saturate(150%);opacity:.95}
[data-theme="light"] #bg{opacity:.4}

.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 50px)}
.glass{
  background:var(--glass);position:relative;overflow:hidden;
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.2);
  border-radius:28px;
}
.glass .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .8s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}

/* Header and settings */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px var(--accent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.35);opacity:.7}}
.tools{display:flex;gap:8px;align-items:center}
.pill-btn,select{
  appearance:none;-webkit-appearance:none;background:var(--glass-strong);color:var(--text);
  border:1px solid var(--border);border-radius:999px;padding:9px 14px;
  font:600 13px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .15s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:100%;
}
.pill-btn:active{transform:scale(.95)}
select option{color:#111}
.settings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;margin-bottom:34px}
.settings label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}

/* Hero */
.hero{text-align:center;margin:18px 0 28px}
.hero h1{font-size:clamp(36px,8.5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.04}
.hero h1 span{background:linear-gradient(120deg,var(--accent),var(--accent2),#7a5cff,var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite}
@keyframes grad{from{background-position:0% 50%}to{background-position:300% 50%}}
.hero p{color:var(--muted);margin-top:14px;font-size:17px}

/* Search */
.search{padding:10px;display:flex;align-items:center;gap:8px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:500 17px Inter,system-ui,sans-serif;padding:12px 10px}
.search input::placeholder{color:var(--muted)}
.circ{
  width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 30px rgba(255,59,78,.4);transition:transform .15s ease;
}
.circ:active{transform:scale(.9)}
.circ.ghost{background:var(--glass-strong);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.circ.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,78,.6)}70%{box-shadow:0 0 0 18px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}
button:disabled{opacity:.45;cursor:not-allowed}
svg.i{width:20px;height:20px}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 15px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s ease}
.chip:active{transform:scale(.96)}

/* Answer */
.answer{margin-top:24px;padding:24px 24px 20px;display:none}
.answer.show{display:block;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.q{font-size:14px;color:var(--muted);margin-bottom:12px;font-weight:600}
.a{font-size:17px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.a.typing::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-3px;background:var(--accent);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--text) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.error{color:var(--accent)}

/* Scroll reveal scenes */
.scene{margin-top:90px;display:grid;grid-template-columns:1fr;gap:26px;align-items:center}
@media(min-width:720px){.scene{grid-template-columns:1fr 1fr}.scene.flip .vis{order:-1}}
.copy{padding:6px 4px}
.copy h2{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.copy p{color:var(--muted);margin-top:12px;font-size:16px;line-height:1.6}
.vis{position:relative;height:280px;border-radius:28px;overflow:hidden;will-change:transform}
.vis .inner{position:absolute;inset:0}
.rv{opacity:0;transform:translateY(40px) scale(.98);filter:blur(8px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1),filter .9s ease}
.rv.in{opacity:1;transform:none;filter:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}

.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.orbit i{position:absolute;border-radius:50%;border:1px solid var(--border);left:50%;top:50%;transform:translate(-50%,-50%)}
.orbit i:nth-child(1){width:90px;height:90px;background:radial-gradient(circle,var(--accent),var(--accent2));border:0;box-shadow:0 0 60px var(--accent);animation:breathe 3s ease-in-out infinite}
.orbit i:nth-child(2){width:160px;height:160px;animation:spin 14s linear infinite}
.orbit i:nth-child(3){width:240px;height:240px;animation:spin 22s linear infinite reverse}
.orbit i:nth-child(4){width:320px;height:320px;animation:spin 30s linear infinite}
.orbit i:nth-child(2)::after,.orbit i:nth-child(3)::after,.orbit i:nth-child(4)::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);top:-5px;left:50%;box-shadow:0 0 14px var(--accent)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:40px}
.bars b{width:14px;border-radius:10px;background:linear-gradient(180deg,var(--accent2),var(--accent));animation:eq 1.2s ease-in-out infinite alternate}
.bars b:nth-child(2){animation-delay:-.3s}.bars b:nth-child(3){animation-delay:-.6s}.bars b:nth-child(4){animation-delay:-.2s}.bars b:nth-child(5){animation-delay:-.8s}.bars b:nth-child(6){animation-delay:-.4s}.bars b:nth-child(7){animation-delay:-1s}
@keyframes eq{from{height:20%}to{height:95%}}

.grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:34px 34px;animation:drift 8s linear infinite}
@keyframes drift{to{background-position:34px 34px}}
.glow{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);filter:blur(10px);left:20%;top:30%;animation:roam 7s ease-in-out infinite alternate}
.glow.g2{background:radial-gradient(circle,#7a5cff,transparent 70%);left:60%;top:45%;animation-duration:9s;animation-delay:-3s}
@keyframes roam{from{transform:translate(0,0)}to{transform:translate(60px,-30px)}}

.cards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:70px}
@media(min-width:720px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{padding:22px}
.card h3{font-size:17px;font-weight:700;margin-bottom:8px}
.card p{color:var(--muted);font-size:14.5px;line-height:1.55}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-bottom:14px;box-shadow:0 8px 24px rgba(255,59,78,.35)}

.hist-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:80px 4px 12px;display:flex;justify-content:space-between;align-items:center}
.hist{padding:6px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:14px;border-radius:18px;cursor:pointer;font:500 15px Inter,system-ui,sans-serif;border-bottom:1px solid var(--border);transition:background .2s}
.item:last-child{border-bottom:0}
.item:hover,.item:active{background:var(--glass-strong)}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:60px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(140px);background:var(--glass-strong);border:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 20px;border-radius:999px;font-size:14px;transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:9;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}}
</style>
</head>

  </div>

    <h1 id="h1"></h1>
    <p id="sub"></p>
  </section>

  <form class="glass search rv d1" id="form" autocomplete="off">
    <input id="q" type="text" placeholder="" maxlength="500" enterkeyhint="send">

      <svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>

  </form>

  <div class="chips rv d2" id="chips"></div>

  <div class="glass answer" id="answer">

    <div class="a" id="aa"></div>
    <div class="actions">
      <button class="pill-btn" id="speak" type="button"></button>
      <button class="pill-btn" id="copy" type="button"></button>

  <section class="scene rv" id="s1">
    <div class="copy"><h2 id="t1"></h2><p id="p1"></p></div>
    <div class="vis glass"><div class="inner"><div class="orbit"><i></i><i></i><i></i><i></i></div></div></div>

  <section class="scene flip rv" id="s2">

  <section class="scene rv" id="s3">

    <div class="vis glass"><div class="inner"><div class="grid"></div><div class="glow"></div><div class="glow g2"></div></div></div>
  </section>

  <div class="cards" id="cards"></div>

  <div class="hist-title"><span id="histTitle"></span><button class="pill-btn" id="clear" type="button" style="padding:6px 12px;font-size:12px"></button></div>
  <div class="glass hist" id="hist"></div>

  <footer>© Redcrdd</footer>
</div>

<div class="toast" id="toast"></div>

  function toast(msg){

  /* ---------- Liquid background ---------- */
  var cv = $("bg"), cx = cv.getContext("2d");
  var RGB = {};
  PKEYS.forEach(function(k){
    RGB[k] = PAL[k].map(function(h){ var n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; });
  });
  function sizeCanvas(){
    cv.width = Math.max(160, Math.round(innerWidth / 3));
    cv.height = Math.max(160, Math.round(innerHeight / 3));
  }
  function colorAt(pal, p){
    var n = pal.length, f = (((p % 1) + 1) % 1) * n;
    var i = Math.floor(f) % n, j = (i + 1) % n, t = f - Math.floor(f);
    return [0,1,2].map(function(k){ return pal[i][k] + (pal[j][k] - pal[i][k]) * t; });
  }

  var scrollP = 0, curP = 0, vel = 0, lastY = 0, hacc = 0;

  function frame(ts){
    curP += (scrollP - curP) * 0.05;
    vel *= 0.92;
    var w = cv.width, h = cv.height, t = ts / 1000;
    cx.clearRect(0, 0, w, h);
    var pal = RGB[bgName] || RGB.ember;
    for(var i = 0; i < 5; i++){
      var c = colorAt(pal, curP * 0.9 + i * 0.07);
      var rgb = Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]);
      var ph = i * 1.9;
      var x = w * (0.5 + 0.4 * Math.sin(t * 0.22 + ph)) + vel * 2 * Math.sin(t + ph);
      var y = h * (0.5 + 0.35 * Math.cos(t * 0.18 + ph * 1.4)) + curP * h * 0.25 * (i % 2 ? 1 : -1) + vel * h * 0.002 * (i + 1);
      var r = Math.min(w, h) * (0.4 + 0.12 * Math.sin(t * 0.4 + ph) + Math.min(Math.abs(vel), 30) * 0.004);
      var g = cx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(" + rgb + ",0.9)");
      g.addColorStop(0.55, "rgba(" + rgb + ",0.38)");
      g.addColorStop(1, "rgba(" + rgb + ",0)");
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Scroll: background, haptics, progress ---------- */

  /* ---------- Touch ripple on glass ---------- */

    s.className = "rp";
    var size = Math.max(r.width, r.height) * 0.5;
    s.style.width = s.style.height = size + "px";
    s.style.left = (e.clientX - r.left - size / 2) + "px";
    s.style.top = (e.clientY - r.top - size / 2) + "px";
    g.appendChild(s);
    setTimeout(function(){ s.remove(); }, 800);
  });

  /* ---------- Voices ---------- */
  function voiceList(){
    var code = LC[lang].slice(0,2);
    return voices.filter(function(v){ return v.lang && v.lang.slice(0,2) === code; });
  }
  function fillVoices(){
    var sel = $("voice"); sel.innerHTML = "";
    var list = voiceList();
    if(!list.length){ sel.add(new Option(T[lang].noVoices, "-1")); return; }
    list.forEach(function(v, i){ sel.add(new Option(v.name, String(i))); });
  }
  function loadVoices(){
    if(!("speechSynthesis" in window)) return;
    voices = speechSynthesis.getVoices();
    fillVoices();
  }
  if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  function speak(text){
    if(!("speechSynthesis" in window)){ toast(T[lang].noVoice); return; }
    speechSynthesis.cancel();
    var list = voiceList();
    var v = list[parseInt($("voice").value, 10)] || null;
    var st = STY[parseInt($("style").value, 10)] || STY[0];
    var parts = (text.match(/[^.!?。！？\n]+[.!?。！？\n]*/g) || [text]).map(function(p){ return p.trim(); }).filter(Boolean);
    var stop = function(){ speaking = false; $("speak").textContent = T[lang].listen; };
    parts.forEach(function(p, i){
      var u = new SpeechSynthesisUtterance(p);
      u.lang = LC[lang];
      if(v) u.voice = v;
      u.pitch = st.p; u.rate = st.r;
      if(i === parts.length - 1){ u.onend = stop; u.onerror = stop; }
      speechSynthesis.speak(u);
    });
    speaking = true;
    $("speak").textContent = T[lang].stop;
  }
  function stopSpeak(){
    if("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; $("speak").textContent = T[lang].listen;

  /* ---------- Answers ---------- */
  function showAnswer(q, a, isError){

  function finish(q, a){
    hist = [{q:q, a:a.slice(0,120)}].concat(hist.filter(function(h){ return h.q !== q; })).slice(0,30);
    saveHist(); renderHist();
    busy = false; $("go").disabled = false;
  }

  function streamAnswer(q, onChunk){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 60000);
    var prompt = PREFIX[lang] + " " + q;
    return fetch(WORKER + encodeURIComponent(prompt), {signal: ctrl.signal})
      .then(function(res){
        if(!res.ok || !res.body) throw new Error("bad response");
        var reader = res.body.getReader();
        var dec = new TextDecoder();
        var buf = "", full = "";
        function pump(){
          return reader.read().then(function(r){
            if(r.done){ clearTimeout(timer); return full.trim(); }
            buf += dec.decode(r.value, {stream:true});
            var lines = buf.split("\n");
            buf = lines.pop();
            lines.forEach(function(line){
              var t = line.trim();
              if(t.indexOf("data:") !== 0) return;
              var d = t.slice(5).trim();
              if(!d || d === "[DONE]") return;
              try{
                var j = JSON.parse(d);
                if(j.response){ full += j.response; onChunk(full); }
              }catch(e){}
            });
            return pump();
          });
        }
        return pump();
      })
      .then(function(text){
        clearTimeout(timer);
        if(!text) throw new Error("empty");
        return text;
      }, function(e){ clearTimeout(timer); throw e; });
  }

  function ask(q){
    q = (q || "").trim();
    if(!q){ toast(T[lang].nothing); return; }
    if(busy) return;
    busy = true; $("go").disabled = true;

    var key = lang + "|" + q.toLowerCase();
    if(cache[key]){
      showAnswer(q, cache[key], false);
      finish(q, cache[key]);
      return;
    }

    showAnswer(q, T[lang].thinking, false);
    var aa = $("aa");
    aa.classList.add("shimmer");
    var started = false;
    var slowT = setTimeout(function(){ if(!started) toast(T[lang].slow); }, 8000);

    streamAnswer(q, function(partial){
      if(!started){
        started = true;
        clearTimeout(slowT);
        aa.classList.remove("shimmer");
        aa.classList.add("typing");
      }
      aa.textContent = partial;
      current = partial;
    }).then(function(full){
      clearTimeout(slowT);
      aa.classList.remove("shimmer", "typing");
      cache[key] = full;
      current = full;
      finish(q, full);
    }, function(){
      clearTimeout(slowT);
      aa.classList.remove("shimmer", "typing");
      showAnswer(q, T[lang].err, true);
      busy = false; $("go").disabled = false;
    });
  }

  /* ---------- Reveal on scroll ---------- */
  var io = null;
  function observeReveal(){
    if(!("IntersectionObserver" in window)){
      document.querySelectorAll(".rv").forEach(function(el){ el.classList.add("in"); });
      return;
    }
    if(!io){
      io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            en.target.classList.add("in");
            if(en.target.classList.contains("scene")) buzz(12);
            io.unobserve(en.target);
          }
        });
      }, {threshold:0.15, rootMargin:"0px 0px -40px 0px"});
    }
    document.querySelectorAll(".rv:not(.in)").forEach(function(el){ io.observe(el); });
  }

    recog = new SR();
    recog.lang = LC[lang];
    recog.interimResults = true;
    recog.continuous = false;
    $("mic").classList.add("listening");
    toast(T[lang].listening);
    recog.onresult = function(ev){
      var text = "";
      for(var i = 0; i < ev.results.length; i++){ text += ev.results[i][0].transcript; }
      $("q").value = text;
      if(ev.results[ev.results.length - 1].isFinal){ ask(text); }
    };
    recog.onend = function(){ $("mic").classList.remove("listening"); recog = null; };
    recog.onerror = function(){ $("mic").classList.remove("listening"); recog = null; };
    try{ recog.start(); }catch(e){ recog = null; $("mic").classList.remove("listening"); }
  });

  /* ---------- Start ---------- */
  sizeCanvas();
  window.addEventListener("resize", sizeCanvas);
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    frame(0);
  } else {
    requestAnimationFrame(frame);
  }
  applyLang();
  observeReveal();
})();
</script>
</body>
  </html>
